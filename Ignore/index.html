<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://quantal-labs.com">
    <title>Redirecting to Quantal Labs</title>
    <style>
        :root {
            --bg-glow: #0d1117;
            --accent-neon: #00f2fe;
            --accent-purple: #4facfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-glow);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(79, 172, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
        }

        /* Top Left Logo Branding */
        .brand-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            height: 40px; /* Adjust height as needed */
            width: auto;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .brand-logo:hover {
            opacity: 1;
        }

        /* Glassmorphism Card */
        .container {
            text-align: center;
            padding: 2.5rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
            z-index: 1;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-neon) 100%);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 242, 254, 0.5);
            letter-spacing: 0.2px;
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
    <script>
        window.location.replace("https://quantal-labs.com");
    </script>
</head>
<body>

    <a href="https://quantal-labs.com">
        <img class="brand-logo" src="https://raw.githubusercontent.com/Codemaster-AR/quantal/main/Logos/Quantal.png" alt="Quantal Labs Logo">
    </a>

    <div class="container">
        <h1>Redirecting You</h1>
        <p>Taking you back to the main hub.</p>
        <a href="https://quantal-labs.com" class="btn">Go to quantal-labs.com</a>
    </div>

</body>
</html>
